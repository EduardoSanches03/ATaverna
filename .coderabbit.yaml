language: "pt-BR"
reviews:
  profile: "chill"
  auto_review:
    enabled: true
    drafts: false
  # Aprova sozinho quando todas as threads estão resolvidas e o último commit foi revisado:
  # é o sinal de parada do skill rabbit-loop.
  auto_approvals:
    enabled: true
  path_instructions:
    - path: "apps/api/**"
      instructions: >-
        Confira as regras de acesso da spec (issue #1): o Mestre vê os PJs e edita os PdMs;
        o Jogador vê e edita só o próprio PJ; História e Anotação são visíveis só para o autor;
        um recurso que o Usuário não pode ver responde 404.
    - path: "**/*.test.ts"
      instructions: >-
        Os testes devem passar pela API HTTP contra Postgres real, sem mockar colaboradores
        internos nem conferir o resultado lendo direto do banco.
chat:
  auto_reply: true
